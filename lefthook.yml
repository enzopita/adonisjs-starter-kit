pre-commit:
  parallel: true
  jobs:
    # Changing the module map can break files that are not staged: lint them all.
    - name: module-boundaries
      glob: '{oxlint.config.ts,apps/backend/modules.json,apps/frontend/features.json}'
      run: pnpm lint
    - run: pnpm exec ultracite fix {staged_files}
      glob:
        - '*.js'
        - '*.jsx'
        - '*.mjs'
        - '*.cjs'
        - '*.ts'
        - '*.tsx'
        - '*.mts'
        - '*.cts'
        - '*.json'
        - '*.jsonc'
        - '*.css'
        - '*.scss'
        - '*.less'
        - '*.vue'
        - '*.svelte'
        - '*.astro'
        - '*.html'
        - '*.md'
        - '*.mdx'
        - '*.yaml'
        - '*.yml'
        - '*.graphql'
        - '*.gql'
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}

pre-push:
  commands:
    openapi:
      root: apps/backend/
      glob: 'apps/backend/{app/**,start/**,config/openapi.ts,adonisrc.ts,package.json,openapi.json}'
      run: node ace openapi:check --strict
