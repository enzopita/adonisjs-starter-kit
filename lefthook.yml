pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{ts,tsx,js,jsx,json,md}"
      run: pnpm oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{ts,tsx,js,jsx}"
      run: pnpm oxlint --type-aware --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    # Changing the module map can break files that are not staged: lint them all.
    module-boundaries:
      glob: "{oxlint.config.ts,apps/backend/modules.json,apps/frontend/features.json}"
      run: pnpm lint

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}

pre-push:
  commands:
    openapi:
      root: apps/backend/
      glob: "apps/backend/{app/**,start/**,config/openapi.ts,adonisrc.ts,package.json,openapi.json}"
      run: node ace openapi:check --strict
